version: '3.8'

services:
  logger:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./data:/app/data

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    depends_on:
      - logger
